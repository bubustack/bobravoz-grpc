name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Buf Lint
        run: make buf-lint

      - name: Buf Breaking
        run: make buf-breaking

      - name: Running Tests
        run: |
          go mod tidy
          make test

name: Docker

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  MANAGER_IMAGE: ghcr.io/${{ github.repository }}
  CONNECTOR_IMAGE: ghcr.io/${{ github.repository_owner }}/bobravoz-grpc-connector

jobs:
  build:
    name: Build and Test Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract manager metadata
        id: meta-manager
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MANAGER_IMAGE }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Extract connector metadata
        id: meta-connector
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONNECTOR_IMAGE }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build manager image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta-manager.outputs.tags }}
          labels: ${{ steps.meta-manager.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build connector image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.connector
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta-connector.outputs.tags }}
          labels: ${{ steps.meta-connector.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build manager image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bobravoz-grpc-manager:scan

      - name: Build connector image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.connector
          load: true
          tags: bobravoz-grpc-connector:scan

      - name: Run Trivy vulnerability scanner on manager
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: bobravoz-grpc-manager:scan
          format: 'sarif'
          output: 'trivy-manager-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on connector
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: bobravoz-grpc-connector:scan
          format: 'sarif'
          output: 'trivy-connector-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload manager Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-manager-results.sarif'

      - name: Upload connector Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-connector-results.sarif'

apiVersion: v1
kind: Service
metadata:
  name: bobravoz-grpc-hub
  annotations:
    kustomize.config.k8s.io/skip-name-prefix: "true"
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: bobravoz-grpc
    app.kubernetes.io/managed-by: kustomize
spec:
  ports:
    - name: grpc
      port: 9000
      protocol: TCP
      targetPort: 9000
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: bobravoz-grpc

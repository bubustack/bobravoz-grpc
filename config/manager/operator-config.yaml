apiVersion: v1
kind: ConfigMap
metadata:
  name: operator-config
  namespace: system
data:
  # Controls the transport security mode for the hub/connector pipeline.
  # Accepted values: "tls" or "plaintext".
  hub.transport-security-mode: "plaintext"
  # Hub buffering and stream tunables.
  hub.buffer-max-messages: "1000"
  hub.buffer-max-bytes: "10485760"
  hub.buffer-eviction-ttl: "10m"
  hub.buffer-eviction-interval: "1m"
  hub.channel-buffer-size: "100"
  hub.per-message-timeout: "10m"
  # Controls whether the connector + hub pipelines propagate OTEL trace context.
  telemetry.trace-propagation: "true"
  # CEL evaluator defaults for hub-side policy evaluation.
  cel.evaluation-timeout: "5s"
  cel.max-expression-length: "4096"
  cel.enable-macros: "true"

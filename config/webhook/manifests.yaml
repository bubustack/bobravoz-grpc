---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: transport-connector-mutating-webhook-configuration
webhooks:
  - name: mtransport-connector.bobravoz.bubustack.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: webhook-service
        namespace: bobrapet-system
        path: /mutate-transport-connector-pod
    # failurePolicy: Fail means webhook unavailability blocks Engram pod creation
    # cluster-wide. This ensures no pod runs without the connector sidecar, but
    # requires high availability of the operator. For environments where availability
    # is preferred over strict injection, consider using Ignore with reconciliation.
    failurePolicy: Fail
    matchPolicy: Equivalent
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    sideEffects: None

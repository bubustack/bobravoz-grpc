apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bobravoz.fullname" . }}-controller-manager
  namespace: {{ include "bobravoz.namespace" . }}
  labels:
    control-plane: controller-manager
    {{- include "bobravoz.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      control-plane: controller-manager
      {{- include "bobravoz.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        control-plane: controller-manager
        {{- include "bobravoz.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "bobravoz.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          {{- $imageTag := .Values.image.tag | default .Chart.AppVersion }}
          image: "{{ .Values.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.manager.leaderElect }}
            - --leader-elect
            {{- end }}
            - --metrics-bind-address={{ .Values.manager.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.manager.healthProbeBindAddress }}
            - --hub-port={{ .Values.manager.grpcPort }}
            - --config-namespace={{ include "bobravoz.effectiveConfigNamespace" . }}
            - --config-name={{ include "bobravoz.configName" . }}
            {{- range .Values.manager.extraArgs }}
            - {{ . | quote }}
            {{- end }}
            {{- if and .Values.metrics.enabled .Values.metrics.tls.enabled }}
            - --metrics-cert-path=/tmp/k8s-metrics-server/metrics-certs
            {{- end }}
          ports:
            - containerPort: {{ .Values.manager.grpcPort }}
              name: grpc
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - containerPort: {{ .Values.metrics.service.port }}
              name: https-metrics
              protocol: TCP
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - containerPort: {{ .Values.webhook.targetPort }}
              name: webhook-server
              protocol: TCP
            {{- end }}
          {{- with .Values.manager.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: hub-tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- if and .Values.metrics.enabled .Values.metrics.tls.enabled }}
            - name: metrics-certs
              mountPath: /tmp/k8s-metrics-server/metrics-certs
              readOnly: true
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
            {{- with .Values.manager.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      terminationGracePeriodSeconds: 10
      volumes:
        - name: hub-tls
          secret:
            secretName: {{ include "bobravoz.hubCertSecretName" . }}
        {{- if and .Values.metrics.enabled .Values.metrics.tls.enabled }}
        - name: metrics-certs
          secret:
            secretName: {{ include "bobravoz.metricsCertSecretName" . }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "bobravoz.webhookCertSecretName" . }}
        {{- end }}
        {{- with .Values.manager.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

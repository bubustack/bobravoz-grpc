{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bobravoz.fullname" . }}-manager-rolebinding
  labels:
    {{- include "bobravoz.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bobravoz.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "bobravoz.serviceAccountName" . }}
    namespace: {{ include "bobravoz.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bobravoz.fullname" . }}-metrics-auth-rolebinding
  labels:
    {{- include "bobravoz.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bobravoz.fullname" . }}-metrics-auth-role
subjects:
  - kind: ServiceAccount
    name: {{ include "bobravoz.serviceAccountName" . }}
    namespace: {{ include "bobravoz.namespace" . }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "bobravoz.hubServiceName" . }}
  namespace: {{ include "bobravoz.namespace" . }}
  labels:
    control-plane: controller-manager
    {{- include "bobravoz.labels" . | nindent 4 }}
    {{- with .Values.hubService.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.hubService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.hubService.type }}
  ports:
    - name: grpc
      port: {{ .Values.hubService.port }}
      protocol: TCP
      targetPort: {{ .Values.manager.grpcPort }}
  selector:
    control-plane: controller-manager
    {{- include "bobravoz.selectorLabels" . | nindent 4 }}
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bobravoz.metricsServiceName" . }}
  namespace: {{ include "bobravoz.namespace" . }}
  labels:
    control-plane: controller-manager
    {{- include "bobravoz.labels" . | nindent 4 }}
    {{- with .Values.metrics.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.metrics.service.type }}
  ports:
    - name: https
      port: {{ .Values.metrics.service.port }}
      protocol: TCP
      targetPort: {{ .Values.metrics.service.port }}
  selector:
    control-plane: controller-manager
    {{- include "bobravoz.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if .Values.webhook.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bobravoz.webhookServiceName" . }}
  namespace: {{ include "bobravoz.namespace" . }}
  labels:
    {{- include "bobravoz.labels" . | nindent 4 }}
    {{- with .Values.webhook.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.webhook.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ports:
    - port: {{ .Values.webhook.port }}
      protocol: TCP
      targetPort: {{ .Values.webhook.targetPort }}
  selector:
    control-plane: controller-manager
    {{- include "bobravoz.selectorLabels" . | nindent 4 }}
{{- end }}

{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bobravoz.fullname" . }}-manager-role
  labels:
    {{- include "bobravoz.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - bubustack.io
    resources:
      - engrams
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - bubustack.io
    resources:
      - stories
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - catalog.bubustack.io
    resources:
      - engramtemplates
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - runs.bubustack.io
    resources:
      - storyruns
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - runs.bubustack.io
    resources:
      - storyruns/finalizers
    verbs:
      - update
  - apiGroups:
      - runs.bubustack.io
    resources:
      - storyruns/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - transport.bubustack.io
    resources:
      - transportbindings
      - transports
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - transport.bubustack.io
    resources:
      - transportbindings/status
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bobravoz.fullname" . }}-metrics-auth-role
  labels:
    {{- include "bobravoz.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bobravoz.fullname" . }}-metrics-reader
  labels:
    {{- include "bobravoz.labels" . | nindent 4 }}
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
{{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bobravoz.serviceAccountName" . }}
  namespace: {{ include "bobravoz.namespace" . }}
  labels:
    {{- include "bobravoz.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccountToken.automount }}
{{- end }}

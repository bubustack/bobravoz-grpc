{{- if .Values.networkPolicy.enabled }}
{{- $selectorLabels := include "bobravoz.selectorLabels" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bobravoz.fullname" . }}-allow-metrics-traffic
  namespace: {{ include "bobravoz.namespace" . }}
  labels:
    {{- include "bobravoz.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      {{- $selectorLabels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              metrics: enabled
      ports:
        - port: {{ .Values.metrics.service.port }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bobravoz.fullname" . }}-allow-hub-traffic
  namespace: {{ include "bobravoz.namespace" . }}
  labels:
    {{- include "bobravoz.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      {{- $selectorLabels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              transport.bobravoz.bubustack.io/connector: "true"
      ports:
        - port: {{ .Values.manager.grpcPort }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bobravoz.fullname" . }}-allow-webhook-traffic
  namespace: {{ include "bobravoz.namespace" . }}
  labels:
    {{- include "bobravoz.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      {{- $selectorLabels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.webhook.targetPort }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bobravoz.fullname" . }}-allow-health-probe-traffic
  namespace: {{ include "bobravoz.namespace" . }}
  labels:
    {{- include "bobravoz.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      {{- $selectorLabels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8081
          protocol: TCP
{{- end }}

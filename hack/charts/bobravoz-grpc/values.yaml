bobravozGrpcHub:
  ports:
  - name: grpc
    port: 9000
    protocol: TCP
    targetPort: 9000
  type: ClusterIP
controllerManager:
  manager:
    args:
    - --metrics-bind-address=:8443
    - --health-probe-bind-address=:8081
    - --hub-port=9000
    - --config-namespace=bobrapet-system
    - --config-name=bobravoz-grpc-operator-config
    - --metrics-cert-path=/tmp/k8s-metrics-server/metrics-certs
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    env:
      bubuHubServiceName: bobravoz-grpc-bobravoz-grpc-hub
      connectorImage: ghcr.io/bubustack/bobravoz-connector:latest
      connectorImagePullPolicy: IfNotPresent
    image:
      repository: ghcr.io/bubustack/bobravoz-grpc
      tag: "" # defaults to .Chart.AppVersion when empty
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  nodeSelector: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  replicas: 1
  tolerations: []
  topologySpreadConstraints: []
kubernetesClusterDomain: cluster.local
metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
operatorConfig:
  connectorImage: ghcr.io/bubustack/bobravoz-connector:latest
  connectorImagePullPolicy: IfNotPresent
  celEnableMacros: "true"
  celEvaluationTimeout: 5s
  celMaxExpressionLength: "4096"
  hubBufferEvictionInterval: 1m
  hubBufferEvictionTtl: 10m
  hubBufferMaxBytes: "10485760"
  hubBufferMaxMessages: "1000"
  hubChannelBufferSize: "100"
  hubPerMessageTimeout: 10m
  hubTransportSecurityMode: plaintext
  telemetryTracePropagation: "true"
serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ""
webhookService:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  type: ClusterIP

# Default values for the bobravoz-grpc transport hub chart.

nameOverride: ""
fullnameOverride: ""

managementNamespace: ""

replicaCount: 1

image:
  repository: ghcr.io/bubustack/bobravoz-grpc
  # Empty tag falls back to Chart.appVersion. Set explicitly for production.
  tag: ""
  pullPolicy: IfNotPresent

connectorImage:
  repository: ghcr.io/bubustack/bobravoz-grpc-connector
  # Empty tag falls back to Chart.appVersion. Set explicitly for production.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

manager:
  leaderElect: true
  metricsBindAddress: ":8443"
  healthProbeBindAddress: ":8081"
  grpcPort: 9000
  configName: bobravoz-grpc-operator-config
  configNamespace: ""
  extraArgs: []
  env: []
  volumeMounts: []
  volumes: []

hubService:
  name: ""
  type: ClusterIP
  annotations: {}
  labels: {}
  port: 9000

tls:
  hubSecretName: ""
  mountPath: /var/run/hub-tls

serviceAccountToken:
  automount: true

rbac:
  create: true

leaderElection:
  create: true

metrics:
  enabled: true
  service:
    type: ClusterIP
    annotations: {}
    labels: {}
    port: 8443
  authProxy:
    enabled: true
  tls:
    enabled: true
    secretName: ""

webhook:
  enabled: true
  failurePolicy: Fail
  sideEffects: None
  timeoutSeconds: 10
  port: 443
  targetPort: 9443
  service:
    annotations: {}
    labels: {}
  certSecretName: ""
  caBundle: ""

certManager:
  enabled: true
  issuer:
    kind: Issuer
    name: bobravoz-grpc-selfsigned
    create: true
  renewalDaysBeforeExpiry: 30

networkPolicy:
  enabled: true

pdb:
  enabled: false
  minAvailable: 1

operatorConfigData:
  hub.transport-security-mode: "tls"
  hub.buffer-max-messages: "1000"
  hub.buffer-max-bytes: "10485760"
  hub.buffer-eviction-ttl: "10m"
  hub.buffer-eviction-interval: "1m"
  hub.channel-buffer-size: "100"
  hub.per-message-timeout: "10m"
  hub.max-active-streams: "2000"
  hub.max-buffers: "1000"
  hub.max-downstreams-hard-cap: "64"
  telemetry.trace-propagation: "true"
  templating.evaluation-timeout: "5s"
  templating.max-output-bytes: "65536"
  templating.deterministic: "false"
  templating.offloaded-data-policy: "error"
  templating.materialize-engram: "bubu-materialize"
